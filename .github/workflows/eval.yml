name: Retrieval eval

# Separate from ci.yml on purpose: this job installs torch +
# sentence-transformers and downloads embedding/reranker weights, so it's
# several minutes and not worth blocking every PR on. Run it manually before
# merging anything that touches chunking/embeddings/reranking, and weekly to
# catch drift.
#
# Note it needs NO API keys -- retrieval and reranking are entirely local, and
# the harness never calls the generation LLM.
on:
  workflow_dispatch:
    inputs:
      fail_under:
        description: "Fail if hit-rate falls below this (0-1)"
        required: false
        default: "0.75"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  pull_request:
    paths:
      - "rag_core/chunking.py"
      - "rag_core/embeddings.py"
      - "rag_core/reranker.py"
      - "rag_core/retrieval.py"
      - "rag_core/vector_store.py"
      - "eval/golden_dataset.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Retrieval hit-rate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Weights are ~150MB and identical between runs.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-ms-marco-minilm

      # eval/golden_dataset.json evaluates the pipeline against this repo's
      # own source, so ingest it first. The harness measures retrieval
      # against whatever is already in the vector store; it doesn't ingest.
      - name: Ingest this repository
        run: python ingest.py https://github.com/${{ github.repository }}

      - name: Run retrieval eval
        run: |
          python -m rag_core.eval_harness \
            --json eval-report.json \
            --fail-under "${{ github.event.inputs.fail_under || '0.75' }}"

      - name: Upload eval report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
          retention-days: 30